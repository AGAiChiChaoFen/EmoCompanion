[project]
name = "audio-emotion-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "deepface>=0.0.93",
    "fastapi>=0.118.0",
    "librosa>=0.11.0",
    "modelscope>=1.35.0",
    "protobuf>=5.29.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "soundfile>=0.13.1",
    "sounddevice>=0.5.2",
    "torch==2.8.0",
    # 显式声明为直接依赖，使 [tool.uv.sources] 的 pytorch-cu128 索引钉住生效
    # （uv 的 sources 钉住只作用于直接依赖；作为传递依赖时会从默认 PyPI 镜像
    #   解析出 CPU 版 torchvision，与 cu128 torch 在导入时报 CUDA 版本不匹配）
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "transformers==4.57.3",
    "uvicorn>=0.37.0",
    "tf-keras>=2.21.0",
    "faiss-cpu>=1.15.0",
    "sentence-transformers>=5.7.0",
    "openai>=2.53.0",
    "pillow>=12.2.0",
    "numpy>=2.2.6",
    "autodistill==0.1.29",
    "autodistill-grounding-dino==0.1.4",
    "roboflow>=1.3.13",
]



[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
